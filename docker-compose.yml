version: '3.8'

services:
  nse-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nse_market_terminal
    restart: unless-stopped
    ports:
      - "8756:8756"
    environment:
      - HOST=0.0.0.0
      - PORT=8756
      - DEBUG=False
      - JWT_SECRET=nse_secure_production_secret_2025_market
      # Optional: Override default credentials
      - AUTH_USER_ADMIN_PASS=Admin@NSE2025!
      - AUTH_USER_ANALYST_PASS=Analyst@NSE2025!
      - AUTH_USER_TESTER_PASS=Tester@NSE2025!
    volumes:
      - nse_data:/app/backend/data
      - nse_exports:/app/backend/exports

volumes:
  nse_data:
    name: nse_terminal_data
  nse_exports:
    name: nse_terminal_exports
