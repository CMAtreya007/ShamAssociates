name: Build Desktop App (Electron for Windows & macOS)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-electron:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            build_command: 'npm run electron:build:win'
            target_os: 'windows'
          - platform: 'macos-latest'
            build_command: 'npm run electron:build:mac'
            target_os: 'macos'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Build Sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pillow
          python backend/build_sidecar.py
          python scripts/generate_icons.py

      - name: Install root & frontend dependencies
        shell: bash
        run: |
          npm install
          npm --prefix frontend install
          chmod -R +x node_modules/.bin frontend/node_modules/.bin 2>/dev/null || true
          npm run build:frontend

      - name: Build Electron Installers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_command }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NSEpulse-${{ matrix.target_os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
