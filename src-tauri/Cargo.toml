[package]
name = "nse-market-suite"
version = "1.0.0"
description = "NSE Market Data Automation & Dashboard Desktop Shell"
authors = ["NSE Market Automation Team"]
edition = "2021"

[lib]
name = "nse_market_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
